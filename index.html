<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia QR</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
    #reader { width: 100%; max-width: 450px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
    #status { margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 8px; }
    .success { background-color: #d4edda; color: #155724; }
    .loading { background-color: #fff3cd; color: #856404; }
  </style>
</head>
<body>

  <h2>Escáner de Asistencia</h2>
  <div id="reader"></div>
  <div id="status">Esperando tarjeta QR...</div>

  <script>
    <script>
    // Tu URL de Google Apps Script
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwciY3qNBOcrWhUXPH6itlxXFmHZvIAFNM4qfdwLTrN1_yuRXavemIJ6NW2dquuPiq0Pw/exec"; 
    let bloqueado = false;

    function onScanSuccess(decodedText) {
      if (bloqueado) return;

      try {
        const studentData = JSON.parse(decodedText);
        bloqueado = true;
        
        const statusDiv = document.getElementById("status");
        statusDiv.className = "loading";
        statusDiv.innerText = `Registrando: ${studentData.nombre || "Estudiante"}...`;

        // Extraer los 4 campos del QR
        const formData = new URLSearchParams();
        formData.append("id", studentData.id || "");
        formData.append("nombre", studentData.nombre || "");
        formData.append("grado", studentData.grado || "");
        formData.append("condicion", studentData.condicion || "");

        fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: formData.toString()
        }).then(() => {
          statusDiv.className = "success";
          // Muestra en pantalla el nombre, grado y condición leídos
          statusDiv.innerText = `✓ Registrado: ${studentData.nombre} | ${studentData.grado || "Sin Grado"} | ${studentData.condicion || "Sin Condición"}`;
          
          setTimeout(() => {
            bloqueado = false;
            statusDiv.className = "";
            statusDiv.innerText = "Esperando tarjeta QR...";
          }, 3000);
        }).catch(err => {
          bloqueado = false;
          statusDiv.innerText = "Error de red al registrar";
        });

      } catch (err) {
        console.warn("QR no válido o no tiene formato JSON:", decodedText);
      }
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    ).catch(err => {
      document.getElementById("status").innerText = "Error al abrir la cámara: " + err;
    });
  </script></body>
</html>
