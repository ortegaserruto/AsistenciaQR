<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia QR</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 15px; margin: 0; }
    h2 { margin: 10px 0; font-size: 1.4rem; color: #333; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
    #status { margin-top: 15px; font-weight: bold; padding: 12px; border-radius: 8px; font-size: 0.95rem; background: #e2e8f0; color: #334155; }
    .success { background-color: #d4edda !important; color: #155724 !important; }
    .loading { background-color: #fff3cd !important; color: #856404 !important; }
    .error { background-color: #f8d7da !important; color: #721c24 !important; }
  </style>
</head>
<body>

  <h2>Escáner de Asistencia</h2>
  <div id="reader"></div>
  <div id="status">Iniciando cámara...</div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwciY3qNBOcrWhUXPH6itlxXFmHZvIAFNM4qfdwLTrN1_yuRXavemIJ6NW2dquuPiq0Pw/exec"; 
    let bloqueado = false;

    function onScanSuccess(decodedText) {
      if (bloqueado) return;
      bloqueado = true;

      const statusDiv = document.getElementById("status");
      statusDiv.className = "loading";
      statusDiv.innerText = "Procesando...";

      let id = "", nombre = "", grado = "", condicion = "";

      // Si viene con formato JSON
      if (decodedText.startsWith("{")) {
        try {
          const data = JSON.parse(decodedText);
          id = data.id || "";
          nombre = data.nombre || "";
          grado = data.grado || "";
          condicion = data.condicion || "";
        } catch (e) {}
      } 
      
      // Si viene separado por barras |
      if (!nombre && decodedText.includes("|")) {
        const partes = decodedText.split("|");
        id = partes[0] ? partes[0].trim() : "";
        nombre = partes[1] ? partes[1].trim() : "";
        grado = partes[2] ? partes[2].trim() : "";
        condicion = partes[3] ? partes[3].trim() : "";
      }

      statusDiv.innerText = `Registrando: ${nombre}...`;

      const formData = new URLSearchParams();
      formData.append("id", id);
      formData.append("nombre", nombre);
      formData.append("grado", grado);
      formData.append("condicion", condicion);

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData.toString()
      }).then(() => {
        statusDiv.className = "success";
        statusDiv.innerText = `✓ Registrado: ${nombre} (${condicion})`;
        setTimeout(() => {
          bloqueado = false;
          statusDiv.className = "";
          statusDiv.innerText = "Esperando tarjeta QR...";
        }, 2500);
      }).catch(err => {
        statusDiv.className = "error";
        statusDiv.innerText = "Error al enviar";
        setTimeout(() => {
          bloqueado = false;
          statusDiv.className = "";
          statusDiv.innerText = "Esperando tarjeta QR...";
        }, 2000);
      });
    }

    // Configuración estable para Chrome Móvil
    const html5QrCode = new Html5Qrcode("reader");
    Html5Qrcode.getCameras().then(cameras => {
      if (cameras && cameras.length) {
        // Selecciona la cámara trasera preferentemente
        const backCamera = cameras.find(cam => cam.label.toLowerCase().includes('back') || cam.label.toLowerCase().includes('trasera')) || cameras[cameras.length - 1];
        
        html5QrCode.start(
          backCamera.id,
          {
            fps: 10,
            qrbox: function(viewfinderWidth, viewfinderHeight) {
              const minEdgePercentage = 0.7;
              const minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
              const qrboxSize = Math.floor(minEdgeSize * minEdgePercentage);
              return { width: qrboxSize, height: qrboxSize };
            }
          },
          onScanSuccess
        ).then(() => {
          document.getElementById("status").innerText = "Esperando tarjeta QR...";
        });
      }
    }).catch(err => {
      document.getElementById("status").className = "error";
      document.getElementById("status").innerText = "Error al acceder a la cámara: " + err;
    });
  </script>
</body>
</html>
