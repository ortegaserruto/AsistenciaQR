<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia - IES Micaela Bastidas</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #0f172a; color: #fff; padding: 15px; margin: 0; }
    
    /* Sección de Cabecera (Logos y Títulos) */
    .header-container { margin-bottom: 20px; }
    .logos { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; }
    .logos img { height: 90px; object-fit: contain; }
    
    h1 { margin: 0 0 5px 0; font-size: 1.5rem; color: #e2e8f0; text-transform: uppercase; letter-spacing: 1px; }
    h2 { margin: 0 0 15px 0; font-size: 1.2rem; color: #38bdf8; }
    
    .profesor-info { background: rgba(56, 189, 248, 0.1); padding: 8px; border-radius: 6px; display: inline-block; margin-bottom: 20px; border: 1px solid rgba(56, 189, 248, 0.2); }
    .profesor-info p { margin: 0; font-size: 0.9rem; color: #cbd5e1; }
    .profesor-info span { font-weight: bold; color: #f8fafc; }

    /* Sección del Escáner */
    #reader { width: 100%; max-width: 380px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 2px solid #334155; }
    #status { margin-top: 15px; font-weight: 600; padding: 12px; border-radius: 8px; font-size: 1rem; background: #1e293b; color: #94a3b8; min-height: 48px; display: flex; align-items: center; justify-content: center; }
    
    /* Estados del Escáner */
    .success { background-color: #15803d !important; color: #ffffff !important; }
    .repeat { background-color: #b45309 !important; color: #ffffff !important; }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="logos">
      <!-- Asegúrate de que los nombres de los archivos coincidan exactamente con cómo los subiste -->
      <img src="ChatGPT Image 12 mar 2026, 18_47_30.png" alt="Insignia IES Micaela Bastidas">
      <img src="AI_Plateado_3D-removebg-preview.jpg" alt="Logo Área de Innovación MIBAS">
    </div>
    <h1>IES Micaela Bastidas</h1>
    <h2>Control de Asistencia QR</h2>
    
    <div class="profesor-info">
      <p><span>Ing. Jose El Justo Ortega Serruto</span><br>Profesor de Innovación Pedagógica</p>
    </div>
  </div>

  <div id="reader"></div>
  <div id="status">Apunte la cámara al código QR</div>

  <script>
    // Tu URL de Google Apps Script (NO LA CAMBIES, ya está la correcta)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwciY3qNBOcrWhUXPH6itlxXFmHZvIAFNM4qfdwLTrN1_yuRXavemIJ6NW2dquuPiq0Pw/exec"; 
    
    let ultimoQR = "";
    let tiempoUltimoQR = 0;
    const audioBeep = new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU"+Array(200).join("1234"));

    function reproducirSonido() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880; 
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch(e) {}
    }

    function onScanSuccess(decodedText) {
      const ahora = Date.now();

      if (decodedText === ultimoQR && (ahora - tiempoUltimoQR) < 6000) {
        return; 
      }

      ultimoQR = decodedText;
      tiempoUltimoQR = ahora;

      let id = "", nombre = "", grado = "", condicion = "";

      if (decodedText.includes("|")) {
        const partes = decodedText.split("|");
        id = partes[0] ? partes[0].trim() : "";
        nombre = partes[1] ? partes[1].trim() : "";
        grado = partes[2] ? partes[2].trim() : "";
        condicion = partes[3] ? partes[3].trim() : "";
      } else if (decodedText.startsWith("{")) {
        try {
          const data = JSON.parse(decodedText);
          id = data.id || "";
          nombre = data.nombre || "";
          grado = data.grado || "";
          condicion = data.condicion || "";
        } catch(e) {}
      }

      if (!nombre) return;

      reproducirSonido();
      const statusDiv = document.getElementById("status");
      statusDiv.className = "success";
      statusDiv.innerHTML = `✓ ${nombre}<br><small style="font-weight:normal">${grado} · ${condicion}</small>`;

      const formData = new URLSearchParams();
      formData.append("id", id);
      formData.append("nombre", nombre);
      formData.append("grado", grado);
      formData.append("condicion", condicion);

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData.toString()
      });

      setTimeout(() => {
        statusDiv.className = "";
        statusDiv.innerText = "Listo para el siguiente...";
      }, 1500);
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { 
        fps: 20, 
        qrbox: 240,
        aspectRatio: 1.0
      },
      onScanSuccess
    ).catch(err => {
      document.getElementById("status").innerText = "Error: Permita el acceso a la cámara";
    });
  </script>
</body>
</html>
