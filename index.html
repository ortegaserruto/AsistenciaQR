<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia QR</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 15px; margin: 0; }
    h2 { margin: 10px 0; font-size: 1.4rem; color: #333; }
    #reader { width: 100%; max-width: 420px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #000; }
    #status { margin-top: 15px; font-weight: bold; padding: 12px; border-radius: 8px; font-size: 0.95rem; background: #e2e8f0; color: #334155; }
    .success { background-color: #d4edda !important; color: #155724 !important; }
    .loading { background-color: #fff3cd !important; color: #856404 !important; }
    .error { background-color: #f8d7da !important; color: #721c24 !important; }
  </style>
</head>
<body>

  <h2>Escáner de Asistencia</h2>
  <div id="reader"></div>
  <div id="status">Esperando tarjeta QR...</div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwciY3qNBOcrWhUXPH6itlxXFmHZvIAFNM4qfdwLTrN1_yuRXavemIJ6NW2dquuPiq0Pw/exec"; 
    let bloqueado = false;

    function onScanSuccess(decodedText) {
      if (bloqueado) return;
      bloqueado = true;

      const statusDiv = document.getElementById("status");
      statusDiv.className = "loading";
      statusDiv.innerText = "Procesando tarjeta...";

      let id = "";
      let nombre = "";
      let grado = "";
      let condicion = "";

      // Intento 1: Parsear como JSON
      try {
        const studentData = JSON.parse(decodedText);
        id = studentData.id || "";
        nombre = studentData.nombre || "";
        grado = studentData.grado || "";
        condicion = studentData.condicion || "";
      } catch (e) {
        // Intento 2: Si el QR es texto separado por comas o barras (ej: EST-001|Juan|3ro A|Zampoñista)
        const partes = decodedText.split(/[,|]/);
        if (partes.length >= 2) {
          id = partes[0].trim();
          nombre = partes[1].trim();
          grado = partes[2] ? partes[2].trim() : "";
          condicion = partes[3] ? partes[3].trim() : "";
        } else {
          // Si no tiene formato, envía todo el texto como nombre
          nombre = decodedText;
        }
      }

      statusDiv.innerText = `Registrando: ${nombre}...`;

      const formData = new URLSearchParams();
      formData.append("id", id);
      formData.append("nombre", nombre);
      formData.append("grado", grado);
      formData.append("condicion", condicion);

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData.toString()
      }).then(() => {
        statusDiv.className = "success";
        statusDiv.innerText = `✓ Registrado: ${nombre}\n${grado} - ${condicion}`;
        
        setTimeout(() => {
          bloqueado = false;
          statusDiv.className = "";
          statusDiv.innerText = "Esperando tarjeta QR...";
        }, 3000);
      }).catch(err => {
        statusDiv.className = "error";
        statusDiv.innerText = "Error de conexión al registrar";
        setTimeout(() => {
          bloqueado = false;
          statusDiv.className = "";
          statusDiv.innerText = "Esperando tarjeta QR...";
        }, 2500);
      });
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    ).catch(err => {
      document.getElementById("status").className = "error";
      document.getElementById("status").innerText = "Error de cámara: " + err;
    });
  </script>
</body>
</html>
