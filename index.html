<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia QR</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #0f172a; color: #fff; padding: 15px; margin: 0; }
    h2 { margin: 8px 0; font-size: 1.3rem; color: #38bdf8; }
    #reader { width: 100%; max-width: 380px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 2px solid #334155; }
    #status { margin-top: 12px; font-weight: 600; padding: 12px; border-radius: 8px; font-size: 1rem; background: #1e293b; color: #94a3b8; min-height: 48px; display: flex; align-items: center; justify-content: center; }
    .success { background-color: #15803d !important; color: #ffffff !important; }
    .repeat { background-color: #b45309 !important; color: #ffffff !important; }
  </style>
</head>
<body>

  <h2>Asistencia QR</h2>
  <div id="reader"></div>
  <div id="status">Apunte la cámara al código QR</div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwciY3qNBOcrWhUXPH6itlxXFmHZvIAFNM4qfdwLTrN1_yuRXavemIJ6NW2dquuPiq0Pw/exec"; 
    
    let ultimoQR = "";
    let tiempoUltimoQR = 0;
    const audioBeep = new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU"+Array(200).join("1234"));

    function reproducirSonido() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880; // Tono agudo
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch(e) {}
    }

    function onScanSuccess(decodedText) {
      const ahora = Date.now();

      // Evita registrar al MISMO estudiante dos veces en menos de 6 segundos
      if (decodedText === ultimoQR && (ahora - tiempoUltimoQR) < 6000) {
        return; 
      }

      ultimoQR = decodedText;
      tiempoUltimoQR = ahora;

      let id = "", nombre = "", grado = "", condicion = "";

      // Extracción rápida por separador |
      if (decodedText.includes("|")) {
        const partes = decodedText.split("|");
        id = partes[0] ? partes[0].trim() : "";
        nombre = partes[1] ? partes[1].trim() : "";
        grado = partes[2] ? partes[2].trim() : "";
        condicion = partes[3] ? partes[3].trim() : "";
      } else if (decodedText.startsWith("{")) {
        try {
          const data = JSON.parse(decodedText);
          id = data.id || "";
          nombre = data.nombre || "";
          grado = data.grado || "";
          condicion = data.condicion || "";
        } catch(e) {}
      }

      if (!nombre) return;

      // 1. Respuesta visual y sonora instantánea (0 ms)
      reproducirSonido();
      const statusDiv = document.getElementById("status");
      statusDiv.className = "success";
      statusDiv.innerHTML = `✓ ${nombre}<br><small style="font-weight:normal">${grado} · ${condicion}</small>`;

      // 2. Envío en segundo plano (Fire and Forget)
      const formData = new URLSearchParams();
      formData.append("id", id);
      formData.append("nombre", nombre);
      formData.append("grado", grado);
      formData.append("condicion", condicion);

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData.toString()
      });

      // Vuelve a estado de espera a los 1.5 segundos
      setTimeout(() => {
        statusDiv.className = "";
        statusDiv.innerText = "Listo para el siguiente...";
      }, 1500);
    }

    // Configuración optimizada de cámara (alta velocidad a 20 FPS)
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { 
        fps: 20, 
        qrbox: 240,
        aspectRatio: 1.0
      },
      onScanSuccess
    ).catch(err => {
      document.getElementById("status").innerText = "Error: Permita el acceso a la cámara";
    });
  </script>
</body>
</html>
